[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ventimath"
version = "0.1.0"
description = "Small standard-library client for VentiMath answer keys and profile skill tags"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/VentiMath/venti-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
